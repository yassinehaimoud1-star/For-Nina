# For-Nina
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters for Nina</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0b0f19, #1b1b3a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .music-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .container {
            max-width: 500px;
            width: 90%;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 400;
        }
        .subtitle {
            color: #b0b0c3;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .letters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .letter-card {
            background: #fff;
            color: #333;
            padding: 20px 15px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
            text-align: left;
            position: relative;
        }
        .letter-card:hover {
            transform: translateY(-3px);
            background: #fdf8f6;
        }
        .letter-title {
            font-size: 13px;
            font-weight: 600;
            color: #4a4a4a;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #fffdf9;
            color: #2c2c2c;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
            text-align: left;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-content p {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-line;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            cursor: pointer;
            color: #888;
        }
        .signature {
            margin-top: 20px;
            text-align: right;
            font-style: italic;
            font-weight: bold;
            color: #555;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>

        <h1>Nina,</h1>
        <div class="subtitle">Four letters from Yassin</div>

        <div class="letters-grid">
            <div class="letter-card" onclick="openLetter('badDay')">
                <div class="letter-title">Open when you had a bad day</div>
            </div>
            <div class="letter-card" onclick="openLetter('cantSleep')">
                <div class="letter-title">Open when you can't sleep</div>
            </div>
            <div class="letter-card" onclick="openLetter('raining')">
                <div class="letter-title">Open when it's raining</div>
            </div>
            <div class="letter-card" onclick="openLetter('loveYou')">
                <div class="letter-title">Open when you need to hear I love you</div>
            </div>
        </div>
    </div>

    <div id="letterModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModalDirect()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalText"></p>
            <div class="signature">Yassin</div>
        </div>
    </div>

    <script>
        const letters = {
            badDay: {
                title: "Open when you had a bad day",
                text: "Dear Nina,\n\nI hope these words can bring a little smile to your face today. I know that bad days sometimes happen and feel heavy, but always remember how strong and wonderful you are, and that this tough day is just temporary and won't last. I am always here for you, and I love you so much. Take a deep breath and relax, and remember that tomorrow brings a fresh, better start."
            },
            cantSleep: {
                title: "Open when you can't sleep",
                text: "Dear Nina,\n\nI know it's late and your mind is probably racing with a million thoughts, but I hope reading this brings you some peace. Just close your eyes, take a deep breath, and let go of everything that happened today. You've done enough, and you deserve a quiet, restful sleep. I'm always wishing you sweet dreams and sending you all my love, even from afar."
            },
            raining: {
                title: "Open when it's raining",
                text: "Dear Nina,\n\nI hope you are sitting somewhere cozy and warm while the rain falls outside. There is something so comforting about a rainy day, and whenever it rains, it always makes me think of you and wish I was right there with you to share a warm cup of coffee or tea. Enjoy the peaceful sound of the drops, let it wash away any stress, and know that you are always in my heart."
            },
            loveYou: {
                title: "Open when you need to hear I love you",
                text: "Dear Nina,\n\nIf you are opening this right now, it means you need a little reminder of how much you mean to me. Even when we are apart, you are always on my mind and in my heart. I want you to know how deeply I care about you, how much I appreciate everything you are, and how grateful I am to have you in my life. Never forget how loved you are, today and always."
            }
        };

        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 Play Music";
            } else {
                music.play();
                musicBtn.innerText = "⏸️ Pause Music";
            }
            isPlaying = !isPlaying;
        }

        function openLetter(type) {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "⏸️ Pause Music";
                }).catch(() => {});
            }
            document.getElementById('modalTitle').innerText = letters[type].title;
            document.getElementById('modalText').innerText = letters[type].text;
            document.getElementById('letterModal').style.display = 'flex';
        }

        function closeModalDirect() {
            document.getElementById('letterModal').style.display = 'none';
        }

        function closeModal(event) {
            if (event.target.id === 'letterModal') {
                document.getElementById('letterModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
